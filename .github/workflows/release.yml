# Quorum: on a tag vX.Y, build the FM-1 package on GitHub, run the host tests, and publish the release with a
# build attestation (actions/attest-build-provenance): the Firmware Hub shows "Built from source" for exactly these
# files. The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), the AC79 SDK from gitee.com,
# as in Dinghy's own workflow. Run by hand (workflow_dispatch) for a test build without a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release X.Y (tags it vX.Y on this commit); empty: a test build only'
        required: false
        default: ''

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    env:
      V: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build (FM-1)
        run: sh build.sh

      - name: Host tests (every script in tests/scripts on the runner)
        run: |
          for f in tests/scripts/*.txt; do
            case "$f" in *smk37*) continue;; esac
            sh tests/run_host.sh "$f" > /dev/null || { echo "::error::host test $f failed"; exit 1; }
          done

      - name: Release package (tags only)
        if: env.V != ''
        run: |
          V="${V#v}"
          echo "V=$V" >> "$GITHUB_ENV"
          sh build.sh --release "$V"
          ls -l build/quorum-"$V".fwsc
          (cd build && sha256sum quorum-"$V".fwsc > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: quorum-fwsc
          path: build/quorum*.fwsc
          if-no-files-found: error

      - name: Attest the package (tags only)
        if: env.V != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/quorum-[0-9]*.fwsc

      - name: Release (tags only)
        if: env.V != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/quorum-[0-9]*.fwsc
            build/SHA256SUMS
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: Quorum ${{ env.V }}
          generate_release_notes: true
